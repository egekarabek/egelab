<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Arka Plan Yuvarlak Köşeli Kart -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />
  <rect width="496" height="496" x="8" y="8" rx="102" fill="none" stroke="#38bdf8" stroke-width="4" stroke-opacity="0.35" />

  <!-- Yörünge Halkaları (Atom & Bilim) -->
  <ellipse cx="256" cy="270" rx="190" ry="75" fill="none" stroke="#38bdf8" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" transform="rotate(-30 256 270)" />
  <ellipse cx="256" cy="270" rx="190" ry="75" fill="none" stroke="#ec4899" stroke-width="4" stroke-dasharray="8 8" opacity="0.4" transform="rotate(30 256 270)" />

  <!-- Dönen Elektronlar -->
  <circle cx="100" cy="210" r="12" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="410" cy="210" r="12" fill="#ec4899" filter="url(#glow)" />
  <circle cx="256" cy="115" r="10" fill="#fbbf24" filter="url(#glow)" />

  <!-- Deney Tüpü / Erlenmayer (Gövde) -->
  <path d="M 226 140 L 286 140 L 286 210 L 370 340 C 386 366 366 400 334 400 L 178 400 C 146 400 126 366 142 340 L 226 210 Z" 
        fill="url(#flaskGrad)" opacity="0.25" stroke="#38bdf8" stroke-width="10" stroke-linejoin="round" />

  <!-- Sıvı Seviyesi -->
  <path d="M 166 350 L 346 350 C 354 362 346 390 330 390 L 182 390 C 166 390 158 362 166 350 Z" 
        fill="url(#liquidGrad)" filter="url(#glow)" />

  <!-- Sıvı Baloncukları -->
  <circle cx="230" cy="330" r="10" fill="#a7f3d0" opacity="0.8" />
  <circle cx="275" cy="305" r="14" fill="#a7f3d0" opacity="0.9" />
  <circle cx="245" cy="265" r="8" fill="#67e8f9" opacity="0.8" />
  <circle cx="280" cy="235" r="12" fill="#67e8f9" opacity="0.9" />

  <!-- Oyun Konsolu D-Pad & Düğmeleri (Erlenmayer üstünde simgesel fusion) -->
  <!-- D-Pad Sol -->
  <path d="M 205 285 h 18 v -18 h 14 v 18 h 18 v 14 h -18 v 18 h -14 v -18 h -18 z" fill="#ffffff" opacity="0.95" />
  
  <!-- Butonlar Sağ -->
  <circle cx="295" cy="285" r="7" fill="#f43f5e" />
  <circle cx="315" cy="298" r="7" fill="#fbbf24" />
  <circle cx="278" cy="298" r="7" fill="#10b981" />
  <circle cx="295" cy="312" r="7" fill="#3b82f6" />

  <!-- Şimşek / Enerji Çizgisi -->
  <polygon points="256,155 240,195 258,195 245,230 272,185 254,185" fill="#facc15" filter="url(#glow)" />

  <!-- EGE LAB Yazısı -->
  <text x="256" y="465" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="52" fill="#f8fafc" text-anchor="middle" letter-spacing="3">
    EGE <tspan fill="#38bdf8">LAB</tspan>
  </text>
</svg>
